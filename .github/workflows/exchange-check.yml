name: Exchange connectivity check

# Runs the real-exchange smoke test from a GitHub runner (which has internet
# access): Binance testnet + live market data (read-only, no API keys),
# WebSocket stream, one screening cycle and a backtest on live history.
#
# Triggered manually (Actions tab → "Exchange connectivity check" → Run workflow)
# or automatically once a day. Note: GitHub runners are US-hosted, so Binance
# may answer HTTP 451 – in that case the report says so explicitly.

on:
  workflow_dispatch:
    inputs:
      backtest_days:
        description: "Backtest window in days"
        default: "60"
        required: false
  schedule:
    - cron: "17 3 * * *"
  push:
    paths:
      - ".github/workflows/exchange-check.yml"
      - "scripts/smoke_local.sh"
      - "backend/data_collector.py"
      - "backend/requirements*.txt"

permissions:
  contents: write   # commit comments carry the report (readable via the API)

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Endpoint reachability probe (from this runner's region)
        run: |
          {
            echo "===== PROBE ====="
            echo "runner ip: $(curl -s -m 5 https://ipinfo.io/json | tr -d '\n' | cut -c1-160)"
            for u in https://fapi.binance.com/fapi/v1/time https://testnet.binancefuture.com/fapi/v1/time \
                     https://api.binance.com/api/v3/time https://data-api.binance.vision/api/v3/time \
                     https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT\&interval=15m\&limit=1 \
                     https://api.telegram.org/bot000:invalid/getMe; do
              code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$u" || echo ERR)
              echo "http $code  $u"
            done
            for h in aws-0-ap-southeast-1.pooler.supabase.com:5432 aws-1-ap-southeast-1.pooler.supabase.com:5432 aws-0-ap-southeast-1.pooler.supabase.com:6543; do
              (timeout 8 bash -c "exec 3<>/dev/tcp/${h%%:*}/${h##*:}" 2>/dev/null && echo "tcp open  $h") || echo "tcp CLOSED $h"
            done
            echo "===== END PROBE ====="
          } | tee probe.txt
      - name: Run smoke test against Binance
        env:
          BACKTEST_DAYS: ${{ github.event.inputs.backtest_days || '60' }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/smoke_local.sh 2>&1 | tee smoke.log || true
          { cat probe.txt; sed -n '/===== REPORT =====/,/===== END REPORT =====/p' smoke.log; } > report.txt
          echo "## Exchange smoke report" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish report as commit comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Exchange connectivity check – run ${{ github.run_id }}"
            echo '```'
            head -c 60000 report.txt
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null
      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log
          path: smoke.log
          retention-days: 14
